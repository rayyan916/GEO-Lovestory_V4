</style><body><div class="wrap"><header><div><div class="brand">心動板塊 / TECTONIC HEARTS</div><div class="small">國際地質災害監測中心 · 四季研究計劃</div></div><button class="compact-menu" onclick="openMenu()" aria-label="開啟遊戲選單">☰ 選單</button><div class="tools header-tools"><button onclick="notes()">研究手冊</button><button onclick="journal()">研究日誌</button><button onclick="gallery()">角色圖鑑</button><button onclick="help()">玩法</button></div></header><main id="app"></main><div class="foot">心動板塊 · 四季研究戀曲｜人物、中心及海嶼市為虛構；所有角色均為成年研究員。地理知識結合構造災害成因、影響及減災措施。</div></div><div id="overlay"></div>
<script>
const DATA={"P": [{"name": "林知震", "field": "地震", "role": "地震與城市韌性研究員", "color": "#79baf5", "hair": "#26394f", "bio": "沉靜、重視證據。喜歡舊地圖和手沖咖啡；相信可靠的承諾要靠行動證明。"}, {"name": "夏映熔", "field": "火山", "role": "火山監測與地熱研究員", "color": "#ffae86", "hair": "#764733", "bio": "爽朗、充滿好奇。喜歡攝影與溫泉地貌；對研究熱情，但從不拿安全冒險。"}, {"name": "蘇海澄", "field": "海嘯", "role": "海嘯預警與沿岸規劃研究員", "color": "#84dbc7", "hair": "#253b48", "bio": "溫柔、善於聆聽。喜歡海洋速寫；最在意研究成果能否讓居民真正理解。"}], "seasons": [{"name": "春", "sub": "初識與奠基", "color": "#a7ddbe", "symbol": "✿", "story": "三月，你在海嶼市的中心分站報到。三位專家帶你熟悉資料室，春季的任務是建立正確概念。彼此還不熟悉，先從可靠的合作開始。", "work": [[{"title": "第一份地震報告", "intro": "知震把斷層資料交給你：「我們先釐清地震怎樣發生，再談城市風險。你不用急著表現，有證據才下結論。」", "qs": [{"t": "斷層岩石受力卻暫時未滑動。哪一項最能解釋隨後的地震？", "opts": ["應力累積，岩石斷裂或突然位移並釋放能量", "海水受日照膨脹", "火山灰壓住地面"], "a": 0, "e": "岩石累積應力，超過其承受能力後沿斷層斷裂及位移，釋放能量形成地震波。"}, {"t": "地下15公里處開始破裂，地面正上方設了觀測點。兩者分別是？", "opts": ["震央、震源", "兩者都是震央", "震源、震央"], "a": 2, "e": "震源是地下開始發震的位置；震央是震源垂直向上的地面位置。15公里屬淺源地震（少於70公里）。"}]}, {"title": "街區損毀調查", "intro": "模擬調查收到兩宗報告：樓宇倒塌，另一街區卻發生燃氣火災。知震請你整理因果鏈，避免只列災害名稱。", "qs": [{"t": "哪一組正確區分直接及次生影響？", "opts": ["兩者都與地震無關", "地面震動是直接；燃氣管破裂引發火災是次生", "火災是直接；地面震動是次生"], "a": 1, "e": "地面震動直接破壞建築物；管道受損後氣體洩漏引發火災，是地震衍生的次生影響。"}, {"t": "飽和鬆散土上的樓宇在地震後下沉，最合理的解釋是？", "opts": ["地下水水壓上升，土壤液化，地基承托力下降", "土壤立即變成堅硬岩石", "震央移到屋頂"], "a": 0, "e": "土壤液化令鬆散、含水土壤喪失部分強度，地基承托能力下降，建築物可能沉降或傾斜。"}]}, {"title": "城市防震提案", "intro": "知震邀你共同向模擬市議會匯報：「居民問我們，買了地震儀是否就安全？請把監測和減災分清楚。」", "qs": [{"t": "哪個方案較全面減低地震損失？", "opts": ["只買保險，停止所有演習", "宣稱明天一定沒有地震", "加強抗震設計、執行建築法例並定期演習"], "a": 2, "e": "交叉支撐、剪力牆和隔震裝置可減低建築物受損；建築法例及演習有助落實防災。保險主要補償經濟損失，不能代替減災。"}, {"t": "兩地震級相同，甲地較接近震源、樓宇較差且人口密集。可以怎樣分析？", "opts": ["只看震級便可確定所有損失", "甲地可能損失較大，須兼看自然和社會經濟因素", "兩地一定死亡人數相同"], "a": 1, "e": "距離、震源深度、地質、人口密度、建築質素和應變能力共同影響破壞；震級並不能單獨決定傷亡。"}]}], [{"title": "岩漿的上升通道", "intro": "映熔正在整理火山剖面：「漂亮的照片不能代替機制。今天我們只分析已收集的資料，不進入封鎖區。」", "qs": [{"t": "建設性板塊邊界如何與火山活動相關？", "opts": ["板塊分開，岩漿可沿裂縫上升", "板塊只水平擦過，所以必有火山", "海浪把岩石變成岩漿"], "a": 0, "e": "板塊分離產生裂縫，岩漿沿弱線或噴道上升至地表；研究內容亦把破壞性板塊邊界列為主要火山分布位置。"}, {"t": "夏威夷火山鏈不在主要板塊邊界上，怎樣解釋？", "opts": ["所有火山必須在板塊邊界，資料一定錯", "每座火山都由海嘯製造", "相對固定的熱點與移動板塊形成一連串火山"], "a": 2, "e": "地幔熱柱可形成熱點；板塊移經相對固定的熱點，形成火山鏈，夏威夷群島是研究例子。"}]}, {"title": "灰燼與機會", "intro": "映熔收到居民的問題：「火山區既有危險，為甚麼仍有人留下？」她請你把短期風險與長期機會放在同一張圖上。", "qs": [{"t": "火山爆發噴出二氧化硫等氣體，可能帶來哪種影響？", "opts": ["消除所有降雨", "呼吸問題及酸雨", "一定使空氣完全無害"], "a": 1, "e": "火山氣體可危害呼吸；二氧化硫等與大氣中的水分反應，可形成酸性降水，破壞環境和建築物。"}, {"t": "哪項合理解釋人們利用火山區的原因？", "opts": ["富含礦物質的火山物質有利土壤肥力，亦可利用地熱", "火山附近任何時間都安全", "熔岩一到農田便立刻提升產量"], "a": 0, "e": "火山物質風化後可有利土壤肥力，並帶來地熱、礦物及旅遊資源；這些機會並不抵消爆發時的破壞。"}]}, {"title": "預警不是保證", "intro": "監測站回報地表膨脹、微震增加及氣體變化。映熔取消野外拍攝：「我們先完成風險通報，晚飯可以改天。」", "qs": [{"t": "哪項是合理的火山監測組合？", "opts": ["只看遊客人數", "只問今天風景是否漂亮", "地震活動、氣體、溫度及地表傾斜或膨脹"], "a": 2, "e": "岩漿活動可能改變微震、氣體和地表形變。要綜合多項資料評估，不能把單一先兆當成必然爆發。"}, {"t": "哪個防災組合最合理？", "opts": ["所有居民都搬到火山口觀察", "風險地圖、疏散路線、適當建築設計及演習", "建熔岩屏障後取消疏散"], "a": 1, "e": "災區地圖及路線協助撤離；堅固用料和傾斜屋頂有助減少部分危害。屏障只能對部分熔岩流有作用，不能防止所有火山危害。"}]}], [{"title": "海床下的連鎖反應", "intro": "海澄打開海床剖面：「海嘯不是普通的風浪。先解釋海水為何被擾動，才知道要看哪些監測資料。」", "qs": [{"t": "哪項最能解釋地震引發海嘯的機制？", "opts": ["海床大規模、快速垂直位移，擾動水體", "季候風把所有海水吹走", "每次陸上地震都必定引發海嘯"], "a": 0, "e": "海床快速垂直變形可擾動大量海水而引發海嘯。是否形成海嘯仍取決於位置、深度、位移等，並非每次地震都會形成。"}, {"t": "除了海底地震，哪組活動也可能引發海嘯？", "opts": ["海灘上的普通步行", "小船停在碼頭", "海底火山爆發、岩崩或山泥快速移入海中"], "a": 2, "e": "海底火山及大量物質突然進入水體，都可能令海水受到快速擾動而形成海嘯。"}]}, {"title": "兩個海灣的報告", "intro": "海澄請你比較低平海岸與較陡海岸：「同一個海嘯，兩地受災也可以很不一樣。請用地勢解釋。」", "qs": [{"t": "其他條件相近，海水較容易深入哪一地區？", "opts": ["所有海岸一定完全相同", "低平、低窪的沿岸", "高而陡的海岸，因為完全沒有阻力"], "a": 1, "e": "低平海岸較易讓海水深入內陸；地勢、海灣形狀及沿岸發展影響損失。海嘯溯上指海水登陸達到的最高高度。"}, {"t": "哪項屬於海嘯可能造成的長期影響？", "opts": ["海岸線改變、生態受損及旅遊經濟受打擊", "只有數分鐘的沿岸泛濫", "任何生態都立即完全復原"], "a": 0, "e": "海嘯可破壞珊瑚礁、沿岸基建及旅遊設施，復原需時；沿岸泛濫和沖刷則是研究內容列出的短期影響。"}]}, {"title": "把警報變成行動", "intro": "海澄草擬沿岸社區演習：「感測器有資料還不夠，居民收到警報後要知道去哪裏。我們一起檢查路線吧。」", "qs": [{"t": "哪一組最能把監測轉化成減災？", "opts": ["把監測數據鎖在辦公室", "只有一張美麗海報，沒有疏散路線", "浮標及海底感測資料、跨區警報、居民可理解的通知及疏散演習"], "a": 2, "e": "監測、預警傳達和居民行動需要連接起來；國際警報系統、地方通訊及演習共同減低傷亡。"}, {"t": "海嘯高危沿岸應優先採用哪項規劃？", "opts": ["以沿岸林地保證海嘯永遠無法通過", "鼓勵遷往高地，規劃通往高地或合適垂直避難設施的路線", "把更多住宅集中在低窪海灣"], "a": 1, "e": "遷往高地及可行疏散路線可減少暴露；沿海建築的加固和合適垂直疏散設計也是教材措施。林地或海堤不能保證完全阻擋海嘯。"}]}]], "strategy": [{"t": "演習：模擬地震破壞道路及供水。即時援助應優先處理甚麼？", "opts": ["協調救援，提供清潔食水、食物和臨時居所並恢復聯絡", "先等全部商店復業", "只拍攝損毀照片"], "a": 0, "e": "即時援助應維持生還者基本生活及救援通道，清理和消毒亦可減低次生風險。"}, {"t": "演習：警報解除後，災區仍有受損基建及居民心理創傷。下一步是？", "opts": ["只恢復觀光，忽略居民", "保險可以代替所有重建", "重建基建與生活秩序，同時提供心理輔導"], "a": 2, "e": "修復措施包括全面重建和輔導。保險可減輕部分經濟損失；國際合作可提供人道援助及重建支援。"}, {"t": "演習：兩個震級相近的城市傷亡差異很大。報告應怎樣解釋？", "opts": ["只寫兩地震級，刪掉其他資料", "比較距離、地質、人口、建築、通訊交通與應變能力", "肯定只是運氣"], "a": 1, "e": "自然因素與社會經濟因素共同影響災害破壞；良好建築、警報、交通通訊及管治可提升應變能力。"}], "dates": [[{"title": "櫻花庭園與手沖咖啡", "intro": "春季的休假日，交班已完成、沒有警報，林知震答應和你參加「櫻花庭園與手沖咖啡」。你們停在她感興趣的展品前，她想知道你的真實感受。", "opts": ["分享自己的感受，也聆聽她的看法", "假裝全部懂，打斷她的分享", "嘲笑她的興趣只會浪費時間"], "a": 0, "e": "你們不必有相同答案，卻因坦誠和聆聽而靠近。", "wrong": "她坦誠表達不舒服，選擇提早結束這次活動。你接受她的決定；未來相處需要更尊重她的時間、感受與界線。", "badDeltas": [0, -4, -7]}, {"title": "舊城地圖展", "intro": "春季的休假日，交班已完成、沒有警報，林知震答應和你參加「舊城地圖展」。她說這個假日需要休息，只能相聚一小時。", "opts": ["要求她取消其他安排陪你整天", "說她不答應便是不重視你", "尊重她的時間，讓她決定縮短或改期"], "a": 2, "e": "她安心地保留自己的步伐，也願意分享更多生活故事。", "wrong": "她坦誠表達不舒服，選擇提早結束這次活動。你接受她的決定；未來相處需要更尊重她的時間、感受與界線。", "badDeltas": [-4, -7, 0]}, {"title": "春日書店散步", "intro": "春季的休假日，交班已完成、沒有警報，林知震答應和你參加「春日書店散步」。你們拍了一張合照，她希望不要公開。", "opts": ["逼她公開合照來證明好感", "先徵求同意，把合照留作私人回憶", "未經同意便公開並標註她"], "a": 1, "e": "她感到私人界線被尊重，主動期待下一次相聚。", "wrong": "她坦誠表達不舒服，選擇提早結束這次活動。你接受她的決定；未來相處需要更尊重她的時間、感受與界線。", "badDeltas": [-7, 0, -4]}], [{"title": "春季花卉攝影展", "intro": "春季的休假日，交班已完成、沒有警報，夏映熔答應和你參加「春季花卉攝影展」。你們停在她感興趣的展品前，她想知道你的真實感受。", "opts": ["假裝全部懂，打斷她的分享", "嘲笑她的興趣只會浪費時間", "分享自己的感受，也聆聽她的看法"], "a": 2, "e": "你們不必有相同答案，卻因坦誠和聆聽而靠近。", "wrong": "她坦誠表達不舒服，選擇提早結束這次活動。你接受她的決定；未來相處需要更尊重她的時間、感受與界線。", "badDeltas": [-4, -7, 0]}, {"title": "開放步道花景攝影", "intro": "春季的休假日，交班已完成、沒有警報，夏映熔答應和你參加「開放步道花景攝影」。她說這個假日需要休息，只能相聚一小時。", "opts": ["說她不答應便是不重視你", "尊重她的時間，讓她決定縮短或改期", "要求她取消其他安排陪你整天"], "a": 1, "e": "她安心地保留自己的步伐，也願意分享更多生活故事。", "wrong": "她坦誠表達不舒服，選擇提早結束這次活動。你接受她的決定；未來相處需要更尊重她的時間、感受與界線。", "badDeltas": [-7, 0, -4]}, {"title": "溫泉地貌圖片展", "intro": "春季的休假日，交班已完成、沒有警報，夏映熔答應和你參加「溫泉地貌圖片展」。你們拍了一張合照，她希望不要公開。", "opts": ["先徵求同意，把合照留作私人回憶", "未經同意便公開並標註她", "逼她公開合照來證明好感"], "a": 0, "e": "她感到私人界線被尊重，主動期待下一次相聚。", "wrong": "她坦誠表達不舒服，選擇提早結束這次活動。你接受她的決定；未來相處需要更尊重她的時間、感受與界線。", "badDeltas": [0, -4, -7]}], [{"title": "海洋水彩展", "intro": "春季的休假日，交班已完成、沒有警報，蘇海澄答應和你參加「海洋水彩展」。你們停在她感興趣的展品前，她想知道你的真實感受。", "opts": ["嘲笑她的興趣只會浪費時間", "分享自己的感受，也聆聽她的看法", "假裝全部懂，打斷她的分享"], "a": 1, "e": "你們不必有相同答案，卻因坦誠和聆聽而靠近。", "wrong": "她坦誠表達不舒服，選擇提早結束這次活動。你接受她的決定；未來相處需要更尊重她的時間、感受與界線。", "badDeltas": [-7, 0, -4]}, {"title": "高地公園春日速寫", "intro": "春季的休假日，交班已完成、沒有警報，蘇海澄答應和你參加「高地公園春日速寫」。她說這個假日需要休息，只能相聚一小時。", "opts": ["尊重她的時間，讓她決定縮短或改期", "要求她取消其他安排陪你整天", "說她不答應便是不重視你"], "a": 0, "e": "她安心地保留自己的步伐，也願意分享更多生活故事。", "wrong": "她坦誠表達不舒服，選擇提早結束這次活動。你接受她的決定；未來相處需要更尊重她的時間、感受與界線。", "badDeltas": [0, -4, -7]}, {"title": "室內海洋音樂會", "intro": "春季的休假日，交班已完成、沒有警報，蘇海澄答應和你參加「室內海洋音樂會」。你們拍了一張合照，她希望不要公開。", "opts": ["未經同意便公開並標註她", "逼她公開合照來證明好感", "先徵求同意，把合照留作私人回憶"], "a": 2, "e": "她感到私人界線被尊重，主動期待下一次相聚。", "wrong": "她坦誠表達不舒服，選擇提早結束這次活動。你接受她的決定；未來相處需要更尊重她的時間、感受與界線。", "badDeltas": [-4, -7, 0]}]]}, {"name": "夏", "sub": "理解風險，也理解彼此", "color": "#ffcf89", "symbol": "☀", "story": "六月，海嶼市進入旅遊旺季。你們分析沿岸人口增加和基建壓力，平日完成工作，假日才相約。暖意來自逐漸了解彼此，而不是冒險逞強。", "work": [[{"title": "震動與城市", "intro": "林知震把夏季資料攤在桌上：「旺季人多，請把災害怎樣影響生活解釋清楚。」", "qs": [{"t": "同一次地震在兩座城的震級相同，但居民感受到的破壞不同。如何理解？", "opts": ["震級會隨每一位居民的感受改變", "烈度只是震源深度的另一名稱", "震級描述釋放能量；烈度描述某地的震感及破壞"], "a": 2, "e": "震級與烈度反映不同事物。同一地震不同地點的烈度可因距離、地質和建築物而不同。"}, {"t": "其他條件相近，20公里深與350公里深的地震，哪項判斷較合理？", "opts": ["深度不影響能量到達地面的情況", "較淺者到地面的能量衰減較少，可能造成較大破壞", "350公里屬淺源，必定更嚴重"], "a": 1, "e": "20公里屬淺源；350公里屬深源。比較破壞仍需考慮震級、距離及社會條件，不能把深度當唯一因素。"}]}, {"title": "道路與救援", "intro": "林知震把夏季資料攤在桌上：「旺季人多，請把災害怎樣影響生活解釋清楚。」", "qs": [{"t": "山區道路被落石封住，救援車隊延誤。哪條因果鏈合理？", "opts": ["地震震動使斜坡物質鬆動→山泥傾瀉→交通受阻→救援延誤", "救援延誤→地震波產生→斜坡變穩定", "道路越陡峭，越不可能受斜坡影響"], "a": 0, "e": "地震可觸發斜坡失穩，陡坡與鬆散物質增加風險；交通中斷亦會加劇救援困難。"}, {"t": "中心只有有限的支援資源。為何要先恢復救援通訊和安全運輸通道？", "opts": ["讓所有觀光活動立即恢復，救援可以等", "因為地震只會影響室內，不會影響道路", "讓救援單位取得需求資料，並把隊伍與物資送到災區"], "a": 2, "e": "通訊和交通中斷會拖慢救援；恢復可靠聯絡與可行路線能改善資源協調。"}]}, {"title": "基本生活與餘震", "intro": "林知震把夏季資料攤在桌上：「旺季人多，請把災害怎樣影響生活解釋清楚。」", "qs": [{"t": "強烈主震後，有同事說「已釋放全部能量，不用再留意」。怎樣回應？", "opts": ["只要第一晚平靜，所有樓宇都安全", "仍可能有餘震，應持續監測並檢查受損建築", "任何主震後都不會有餘震"], "a": 1, "e": "餘震可持續一段時間，受損建築也可能在後續震動中倒塌，不能把主震結束視作危險完全消失。"}, {"t": "地震後避難所缺乏清潔水源。哪項支援能直接減低相關健康風險？", "opts": ["補充清潔食水、衛生設施和基本生活物資", "只提供旅遊小冊子", "以購買保險代替所有飲用水"], "a": 0, "e": "缺乏清潔食水與妥善衛生會增加疾病風險；即時援助須照顧生還者基本需要。"}]}], [{"title": "熔岩與氣體", "intro": "夏映熔把夏季資料攤在桌上：「旺季人多，請把災害怎樣影響生活解釋清楚。」", "qs": [{"t": "模擬火山爆發中，熔岩流接近農田和住宅。最直接的影響是？", "opts": ["農作物立刻大量增產而沒有損失", "所有熔岩都是低溫海水", "高溫熔岩覆蓋和燒毀地物，可能引發火災"], "a": 2, "e": "熔岩流可破壞附近土地、房屋和農田。長期土壤肥力改善不代表當下爆發有利農作物。"}, {"t": "觀測報告提到火山氣體增加，為甚麼不能當成只是煙霧？", "opts": ["只要看不見氣體，就一定沒有危險", "部分氣體可危害呼吸或造成窒息，須評估暴露風險", "火山氣體全部都是可直接飲用的水"], "a": 1, "e": "火山氣體的性質和濃度影響風險；部分具毒性，二氧化碳濃度過高亦有窒息風險。"}]}, {"title": "灰屑與泥流", "intro": "夏映熔把夏季資料攤在桌上：「旺季人多，請把災害怎樣影響生活解釋清楚。」", "qs": [{"t": "火山灰大量沉降於附近城鎮。哪項建築措施與研究內容所述風險相配？", "opts": ["採用合適的堅固結構及傾斜屋頂，減少積灰負荷", "把屋頂改成更弱的平面以累積更多灰", "認為灰一定沒有重量，不須評估"], "a": 0, "e": "火山灰可覆蓋地面及建築；研究手冊提出傾斜屋頂有助卸去火山灰，仍須由專業人員評估結構。"}, {"t": "火山區灰屑與鬆散物質遇上大量雨水，可能形成哪種次生危害？", "opts": ["海岸一定會立刻升高成高山", "所有坡面即時變得穩固", "泥流沿低處或河谷移動，掩沒沿途地區"], "a": 2, "e": "雨水與火山碎屑及泥土混合可形成泥流，危害不只限於火山口。"}]}, {"title": "機會與旅遊", "intro": "夏映熔把夏季資料攤在桌上：「旺季人多，請把災害怎樣影響生活解釋清楚。」", "qs": [{"t": "火山區農業受破壞後，怎樣區分短期損失與長期機會？", "opts": ["火山灰從來不含任何礦物質", "短期可能失收；火山物質風化後可為土壤提供礦物質", "短期熔岩越熱越適合立即播種"], "a": 1, "e": "爆發可造成失收甚至饑荒；長期風化與土壤形成則可帶來肥力，兩者時間尺度不同。"}, {"t": "溫泉景點吸引遊客，但附近有活火山。哪項提案合理？", "opts": ["結合風險評估、監測、限制高危區活動及疏散安排", "為增加收入，取消全部警報和封鎖", "只要是旅遊景點，火山就不再爆發"], "a": 0, "e": "火山地貌帶來旅遊機會，仍需管理風險。經濟價值不能代替安全評估和演習。"}]}], [{"title": "沿岸暴露", "intro": "蘇海澄把夏季資料攤在桌上：「旺季人多，請把災害怎樣影響生活解釋清楚。」", "qs": [{"t": "海嘯湧向低平且住宅密集的海岸，哪個風險組合值得關注？", "opts": ["低平海岸一定阻擋所有海浪", "人口密度與災害損失完全無關", "海水較易深入內陸，加上多人及高價值地物暴露"], "a": 2, "e": "地勢影響海水侵入，人口和土地利用影響暴露與損失，自然和人文因素需一併分析。"}, {"t": "海嘯把街道物件推向內陸，並短時間淹浸沿岸。兩者分別是？", "opts": ["板塊分開與地熱發電", "沖刷效應與泛濫", "只有長期心理創傷"], "a": 1, "e": "海水把物體推移並破壞聚落屬沖刷；海水短時間湧入沿岸形成泛濫。"}]}, {"title": "長期損失", "intro": "蘇海澄把夏季資料攤在桌上：「旺季人多，請把災害怎樣影響生活解釋清楚。」", "qs": [{"t": "沿岸水位退去，但珊瑚礁和港口仍受損。哪項說法較合理？", "opts": ["海水退去不等於生態與經濟已復原", "水位下降便代表珊瑚礁瞬間長回", "港口受損與經濟活動無關"], "a": 0, "e": "海嘯可造成長期生態破壞，並損毀運輸和旅遊基建，修復需要時間。"}, {"t": "海嘯後海岸線與舊地圖不同。研究員應怎樣處理？", "opts": ["不管現場資料，只保留舊圖", "海嘯只能改變空氣，不能改變海岸", "更新測量與風險資料，評估沿岸土地及生態改變"], "a": 2, "e": "強烈海嘯可侵蝕及重塑沿岸土地；更新資料有助修復和規劃。"}]}, {"title": "通知與遊客", "intro": "蘇海澄把夏季資料攤在桌上：「旺季人多，請把災害怎樣影響生活解釋清楚。」", "qs": [{"t": "浮標和海底感測器提供水體資料後，為何仍要對外發布警報？", "opts": ["監測資料只能用來裝飾報告", "數據需轉成可理解、可執行的撤離訊息", "儀器存在便會自動讓每位居民到高地"], "a": 1, "e": "監測只是一環，警報傳達、疏散路線及居民的行動決定減災效果。"}, {"t": "旅遊旺季多了不熟悉道路的遊客，哪項安排較切合需要？", "opts": ["清楚的疏散標示、多語通知及面向遊客的演習資訊", "移除全部路標，避免破壞風景", "只通知長住居民，遊客不受海嘯影響"], "a": 0, "e": "暴露人口增加且不熟悉地形，需要可理解的預警與路線資訊；公眾教育應包括不同群體。"}]}]], "strategy": [{"t": "夏季策略：救援路線同時面對落石與海嘯高危區，怎樣選擇？", "opts": ["只選最短路線，忽略落石與沿岸水浸", "只避開火山口，其餘所有地點必定安全", "結合斜坡、海嘯风險圖與現場資訊，協調已確認安全的替代通道"], "a": 2, "e": "跨災害規劃須叠加不同危害與現場資訊，路線安全和救援可達性應共同考慮。"}, {"t": "夏季策略：人口密集住宅受震損，沿岸旅遊區也受淹。資源應怎样分配？", "opts": ["只給最富裕地方，其他地點不需支援", "依急迫需要、暴露人口與可达性協調救援及基本物資", "只按景點知名度分配，忽略居民"], "a": 1, "e": "人口、土地利用、交通通訊和災情共同影響损失與救援需求，支援應依實際需要協調。"}, {"t": "夏季策略：供水中斷與火山灰沉降同時影響居民，怎樣減少次生風險？", "opts": ["提供安全食水和臨時庇護，傳達健康及撤離資訊", "只卖保險便可取代一切即時援助", "為了拍摄讓居民長期留在灰區"], "a": 0, "e": "即時援助須維持生活基本需要，並配合監測、預警及適當庇護以减低額外傷害。"}], "dates": [[{"title": "有冷氣的城市博物館", "intro": "夏季的休假日，交班已完成、沒有警報，林知震答應和你參加「有冷氣的城市博物館」。她想嘗試新活動，也坦白自己並不熟練。", "opts": ["每次失誤都打斷她來展示自己", "把她失誤的影片公開給同事取笑", "一起慢慢嘗試，不以成績或表現取笑她"], "a": 2, "e": "你們笑着面對小失誤，她喜歡不必完美也能自在相處。", "wrong": "她坦誠表達不舒服，選擇提早結束這次活動。你接受她的決定；未來相處需要更尊重她的時間、感受與界線。", "badDeltas": [-4, -7, 0]}, {"title": "室內手沖咖啡工作坊", "intro": "夏季的休假日，交班已完成、沒有警報，林知震答應和你參加「室內手沖咖啡工作坊」。活動遇上天氣轉差，她提議改到室內。", "opts": ["責怪她重視安全就是破壞氣氛", "一起確認公告與天氣，接受室內替代活動", "為了浪漫堅持去已封閉的戶外地點"], "a": 1, "e": "你們在室內找到新的樂趣，她感到你重視彼此的安全。", "wrong": "她坦誠表達不舒服，選擇提早結束這次活動。你接受她的決定；未來相處需要更尊重她的時間、感受與界線。", "badDeltas": [-7, 0, -4]}, {"title": "夏夜圖書館閱讀會", "intro": "夏季的休假日，交班已完成、沒有警報，林知震答應和你 ", "story": "九月，中心協助城市檢視土地利用與防災方案。三位專家開始把更完整的報告交給你，也分享各自的生活步伐。信任需要持續的專業與尊重。", "work": [[{"title": "板塊與斷層", "intro": "林知震把秋季資料攤在桌上：「這次報告要協助規劃，不能只列措施而不说理由。」", "qs": [{"t": "內陸地區遠離板塊邊界卻發生地震，最合理的解釋是？", "opts": ["所有內陸震動一定是火山爆發", "板塊內斷層受力、斷裂或位移，也能釋放能量", "只有海岸才存在任何斷層"], "a": 1, "e": "板內地震可由板塊內部斷層活動引起，不能把地震風險限於板塊邊界。"}, {"t": "保守性板塊邊界的板塊水平擦過，主要涉及哪種受力？", "opts": ["剪切力，可形成水平位移斷層並引發地震", "只有張力，必定形成新海洋地殼", "沒有任何摩擦或應力"], "a": 0, "e": "保守性邊界水平滑動涉及剪切；破壞性邊界主要為擠壓，建設性邊界主要為張力。"}]}, {"title": "風險與管治", "intro": "林知震把秋季資料攤在桌上：「這次報告要協助規劃，不能只列措施而不说理由。」", "qs": [{"t": "計劃在高危斷層附近興建大型油庫。最合理的評估是？", "opts": ["油庫經濟價值高，所以地震風險自動消失", "只計算遊客人數，忽略油庫", "考慮次生火災等危害，避免把高危設施放在高風險區"], "a": 2, "e": "風險地圖有助土地利用規劃；油庫等設施受損可能引發更嚴重的次生災害。"}, {"t": "城市有抗震建築法例，但工程經常偷工減料，問題在哪裏？", "opts": ["人口密度可以修補所有劣質混凝土", "法例執行和管治欠佳，抗震設計未真正落實", "只要法例名字存在，樓宇必定安全"], "a": 1, "e": "建築設計和用料需配合有效監管。政治與管治因素會影響防災措施是否落實。"}]}, {"title": "斜坡與庇護", "intro": "林知震把秋季資料攤在桌上：「這次報告要協助規劃，不能只列措施而不说理由。」", "qs": [{"t": "一個內陸高地城鎮附近有陡坡和鬆散物質。能否因遠離海嘯便忽略全部風險？", "opts": ["不能；地震可觸發斜坡失穩等次生災害", "可以；高地從來不受地震影響", "可以；高地所有岩石都沒有斷層"], "a": 0, "e": "不同災害要分別評估；高地可降低海嘯暴露，卻不必然降低地震及斜坡風險。"}, {"t": "規劃地震後的安全集合與臨時庇護，哪個組合較全面？", "opts": ["所有人集中在受損高樓下面", "只建購物中心，不考慮疏散", "預留空曠地，並評估學校或場館是否適合作庇護中心"], "a": 2, "e": "開放空間有助疏散集合；臨時庇護場所須考慮結構安全及基本設施。"}]}], [{"title": "地圖與通道", "intro": "夏映熔把秋季資料攤在桌上：「這次報告要協助規劃，不能只列措施而不说理由。」", "qs": [{"t": "一份火山風險地圖應用於哪項決策？", "opts": ["只把顏色用作海報背景", "辨識高危區、限制暴露並規劃安全疏散路線", "承諾地圖上的所有地點永遠安全"], "a": 1, "e": "風險地圖協助把研究結果轉成土地利用、緩衝區及疏散安排。"}, {"t": "在有岩漿活動的地區，裂縫延伸至岩漿室，為何可能與爆發相關？", "opts": ["岩漿和氣體可沿弱線或噴道上升至地表", "裂縫必定把岩漿變成冰", "裂縫會令所有地下壓力永久消失且不噴出物質"], "a": 0, "e": "岩漿及氣體在壓力作用下可沿裂縫上升；監測要結合其他指標判斷活動。"}]}, {"title": "工程與資源", "intro": "夏映熔把秋季資料攤在桌上：「這次報告要協助規劃，不能只列措施而不说理由。」", "qs": [{"t": "市民問熔岩屏障是否等於不用撤離，應如何解釋？", "opts": ["屏障可阻擋所有火山氣體、灰屑和爆炸", "只要屏障存在，任何爆發都不會發生", "屏障只可減少部分熔岩流危害，仍需監測及疏散"], "a": 2, "e": "火山危害類型多樣，單一工程措施不能提供全面保護，需多種措施互相配合。"}, {"t": "利用火山區地熱發電屬於哪種機會？", "opts": ["證明該火山已完全沒有災害風險", "把地下蒸氣及熱水的熱能轉為能源", "把海嘯烈度直接變為電力"], "a": 1, "e": "地熱能是火山區資源之一；利用資源仍須監測和評估相關風險。"}]}, const {P,seasons,events}=DATA;const KEY='tectonic-hearts-four-seasons-v2';let S=null,saved=null,storageOK=true,returnFocus=null;
const $=id=>document.getElementById(id);const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));saved=JSON.parse(JSON.stringify(S))}catch(e){storageOK=false}}
function seasonData(){return seasons[S.season]}
function workCount(){return S.done.reduce((a,b)=>a+b,0)}

const CHARACTER_IMAGES=[{"smile": "https://i.postimg.cc/QxCkTjpR/01lin-zhi-zhen-01zi-ran-wei-xiao.png", "think": "https://i.postimg.cc/sDx9h3pb/01lin-zhi-zhen-02zhuan-zhu-si-kao.png", "happy": "https://i.postimg.cc/65qLvBdk/01lin-zhi-zhen-03kai-xin.png", "blush": "https://i.postimg.cc/bNrHtqxX/01lin-zhi-zhen-04xin-dong.png", "worried": "https://i.postimg.cc/FszgLhyr/01lin-zhi-zhen-05dan-you.png", "sad": "https://i.postimg.cc/HsN00F2f/01lin-zhi-zhen-06nan-guo.png"}, {"smile": "https://i.postimg.cc/15d00bB1/02xia-ying-rong-01zi-ran-wei-xiao.png", "think": "https://i.postimg.cc/GhfPP6KC/02xia-ying-rong-02zhuan-zhu-si-kao.png", "happy": "https://i.postimg.cc/7YR11j9b/02xia-ying-rong-03kai-xin.png", "blush": "https://i.postimg.cc/hPY88Nsm/02xia-ying-rong-04xin-dong.png", "worried": "https://i.postimg.cc/Mpj79t3c/02xia-ying-rong-05dan-you.png", "sad": "https://i.postimg.cc/4xh6Ww2V/02xia-ying-rong-06nan-guo.png"}, {"smile": "https://i.postimg.cc/GmsFXzgM/03su-hai-cheng-01zi-ran-wei-xiao.png", "think": "https://i.postimg.cc/wB8hZJnf/03su-hai-cheng-02zhuan-zhu-si-kao.png", "happy": "https://i.postimg.cc/GpwkVY6Z/03su-hai-cheng-03kai-xin.png", "blush": "https://i.postimg.cc/Bv9xkDdt/03su-hai-cheng-04xin-dong.png", "worried": "https://i.postimg.cc/Xvfwbqbp/03su-hai-cheng-05dan-you.png", "sad": "https://i.postimg.cc/7L3gkhkG/03su-hai-cheng-06nan-guo.png"}];
const EXPRESSION_NAMES={smile:'自然微笑',think:'專注思考',happy:'開心／欣賞',blush:'害羞／心動',worried:'擔憂／緊張',sad:'難過／失望'};
function sceneExpression(){if(!S||!S.active)return 'smile';let a=S.active;if(a.type==='event')return a.answered&&a.result.ok?'think':'worried';if(a.type==='date'){if(a.answered)return a.result.ok?(S.aff[a.i]>=55?'blush':'happy'):'sad';return S.aff[a.i]>=55&&S.care[a.i]>=2?'blush':'smile'}if(a.answered)return a.result.ok?'happy':'think';return 'think'}
function cardExpression(){return S&&S.phase==='relation'?'happy':'smile'}
function endingExpression(){if(!S||!S.ending)return 'smile';let e=S.ending;if(e.type==='bad')return 'sad';if(e.title.includes('心意相通'))return 'blush';if(e.title.includes('成長'))return 'think';return 'smile'}
function imageLoaded(img){img.parentElement.classList.remove('failed');img.parentElement.classList.add('ready')}
function imageFailed(img){img.parentElement.classList.remove('ready');img.parentElement.classList.add('failed')}
function retryPortrait(button){let panel=button.closest('.portrait'),img=panel.querySelector('.character-img');panel.classList.remove('ready','failed');let src=img.getAttribute('src').split('?')[0];img.src=src+'?retry='+Date.now()}
function portrait(i,expression='smile'){let p=P[i],key=CHARACTER_IMAGES[i][expression]?expression:'smile',name=EXPRESSION_NAMES[key],svg=vectorPortrait(i).match(/<svg[\s\S]*?<\/svg>/)[0];return `<div class="portrait illustrated" style="--c:${p.color}" data-character="${i}" data-expression="${key}"><img class="character-img" src="${CHARACTER_IMAGES[i][key]}" alt="${p.name} · ${name}" decoding="async" onload="imageLoaded(this)" onerror="imageFailed(this)"><span class="tag">${p.field}專家</span><div class="portrait-loading" role="status">正在載入${p.name}的插圖…</div><div class="portrait-fallback" aria-hidden="true">${svg}</div><div class="portrait-error" role="status"><span>插圖未能載入，請檢查網絡。</span><button type="button" onclick="retryPortrait(this)">重試圖片</button></div></div>`}
function showActivePortrait(){if(!S||!S.active)return;let i=S.active.i,key=sceneExpression();modal(`<h2>${P[i].name}</h2><p class="small">${EXPRESSION_NAMES[key]}</p><div class="artwork-preview">${portrait(i,key)}</div>`)}
function gallery(i=0){modal(`<h2>${P[i].name} · 表情圖鑑</h2><div class="notesfilters">${P.map((p,j)=>`<button onclick="gallery(${j})" ${i===j?'class="primary"':''}>${p.name}</button>`).join('')}</div><p class="small">插圖按遊戲情境自動切換，圖片需連網載入。</p><div class="expression-grid">${Object.keys(EXPRESSION_NAMES).map(key=>`<figure>${portrait(i,key)}<figcaption>${EXPRESSION_NAMES[key]}</figcaption></figure>`).join('')}</div>`)}
function home(){S=null;updateLayoutMode();applyTheme();$('app').innerHTML=`<section class="hero"><div class="eyebrow">四季研究戀曲 · 一年相識，一次真正的考驗</div><h1>四季流轉，<br>把心意化為守護。</h1><p>你在海嶼市加入監測中心，與地震、火山和海嘯專家一起度過春夏秋冬。研究、假日邀約與策略演習，讓理解慢慢成為信任。冬季之後，一場大型構造災害將考驗你的應變。</p><div class="stats"><span class="pill">每季21次地理判斷 · 四季84次</span><span class="pill">每季3次假日邀約</span><span class="pill">最終事件8次應變決策</span></div><div class="notice"><b>最終事件規則</b><p>大型災害中累計3次錯誤應變，便會觸發玩家在災害中過身的 Bad ending。前四季的研究錯題不會計入；事件中答對後，之前的錯誤也不會歸零。死亡情節以文字呈現。</p></div><form class="introform" onsubmit="event.preventDefault();start()"><label class="small" for="name">研究員姓名</label><input id="name" required maxlength="24" placeholder="輸入姓名，展開四季故事" autocomplete="off"><button type="submit" class="primary">春季報到 →</button></form>${saved?'<button onclick="resume()">繼續四季故事 →</button>':''}<p class="small">可分多次完成；這部裝置會自動儲存進度。四季版採用獨立進度，不接續舊單季故事。</p>${!storageOK?'<p class="warning">目前不能自動儲存，請保持頁面開啟。</p>':''}</section><div class="grid">${P.map((p,i)=>`<article class="card">${portrait(i)}<div class="content"><h3>${p.name}</h3><div class="label">${p.role}</div><p class="small">${p.bio}</p></div></article>`).join('')}</div>`}
function start(){let n=$('name').value.trim();if(!n){$('name').focus();return}S={v:2,name:n,season:0,phase:'hub',aff:[20,20,20],respect:[20,20,20],care:[0,0,0],done:[0,0,0],dates:[0,0,0],strategy:0,correct:0,total:0,log:[],active:null,records:[],eventStep:0,eventWrong:0,eventCorrect:0,eventDeath:false,checkpoint:null,ending:null};persist();render()}
function resume(){S=JSON.parse(JSON.stringify(saved));render()}
function detailedStats(){let eventMode=['crisisBrief','crisis','relation','ending'].includes(S.phase);return `<div class="seasonnav">${seasons.map((s,i)=>`<div class="${i===S.season?'current':''}">${i<S.records.length?'✓ ':''}${s.symbol} ${s.name}季<span class="small"> · ${i<S.records.length?'完成':i===S.season?'目前':'待開啟'}</span></div>`).join('')}</div><div class="stats"><span class="pill">${esc(S.name)} · 研究員</span><span class="pill">全年地理判斷 ${S.total}/84 · 正確 ${S.correct}</span>${eventMode?`<span class="pill">事件決策 ${S.eventStep+(S.active&&S.active.type==='event'&&S.active.answered?1:0)}/8 · 錯誤 ${S.eventWrong}/3</span>`:`<span class="pill">本季研究 ${workCount()}/9 · 假日 ${dateCount()}/3 · 策略 ${S.strategy}/3</span>`}</div>${!storageOK?'<p class="warning small">目前無法自動儲存；請保持頁面開啟。</p>':''}`}
function updateLayoutMode(){document.body.classList.toggle('scene-mode',Boolean(S&&S.active))}
function stats(){let inEvent=['crisisBrief','crisis','relation','ending'].includes(S.phase),label=inEvent?`事件 ${S.eventStep+(S.active&&S.active.type==='event'&&S.active.answered?1:0)}/8 · 錯誤 ${S.eventWrong}/3`:`本季判斷 ${S.total-S.season*21}/21`;return `<div class="progress-full">${detailedStats()}</div><div class="progress-compact"><span>${seasons[S.season].symbol} ${sName()} · ${label}</span><button onclick="progressPanel()">進度詳情</button></div>`}
function progressPanel(){if(!S)return;modal(`<h2>研究進度</h2>${detailedStats()}<div class="progress-people">${P.map((p,i)=>`<div class="box"><h3>${p.name}</h3><p>好感 ${S.aff[i]}/100 · 專業尊敬 ${S.respect[i]}/100<br>尊重互動 ${S.care[i]}次</p></div>`).join('')}</div>`)}
function openMenu(){modal(`<h2>遊戲選單</h2><div class="menu-actions"><button onclick="closeModal();notes()">研究手冊</button><button onclick="closeModal();journal()">研究日誌</button><button onclick="closeModal();gallery()">角色圖鑑</button><button onclick="closeModal();help()">玩法說明</button>${S?'<button onclick="closeModal();progressPanel()">進度與好感</button>':''}</div>`)}
function setSceneView(view){if(!S||!S.active||!['story','question','feedback'].includes(view)||view==='feedback'&&!S.active.answered)return;S.active.view=view;persist();render()}
function render(){updateLayoutMode();if(!S)return home();applyTheme();if(S.active)return scene();if(S.phase==='crisisBrief')return crisisBrief();if(S.phase==='crisis')return crisisHub();if(S.phase==='relation')return relation();if(S.phase==='ending')return ending();hub()}
function characterCard(i,action=''){let p=P[i];return `<article class="card" style="--c:${p.color}">${portrait(i,cardExpression())}<div class="content"><h3>${p.name}</h3><div class="label">${p.role}</div><p class="small">${p.bio}</p><div class="small">好感 ${S.aff[i]}/100</div><div class="bar"><span style="width:${S.aff[i]}%"></span></div><div class="small">專業尊敬 ${S.respect[i]}/100 · 尊重互動 ${S.care[i]}次</div>${action}</div></article>`}
function hub(){let s=seasonData(),w=workCount(),d=dateCount(),mode=w<9?'work':d<3?'date':S.strategy<3?'strategy':'complete';$('app').innerHTML=stats()+`<div class="box"><div class="eyebrow">${s.symbol} ${s.name}季 · ${s.sub}</div><h2>${mode==='work'?'和誰一起展開研究？':mode==='date'?'假日到了，想和誰一起相約？':mode==='strategy'?'把三種災害放在同一份策略裏。':'本季任務完成 · 故事繼續前進'}</h2><p>${s.story}</p><p class="small">${mode==='work'?'每位專家有3份依序開放的任務，每份含2次地理判斷。可自由決定三條研究線的先後順序。':mode==='date'?'本季共有3次假日邀約，可集中在同一人或認識不同的人。同一人的活動會依序開放；平日工作和正式值班不被邀約打斷。':mode==='strategy'?'3次跨災害策略判斷，完成後本季地理判斷合計21次。任務使用模擬資料，錯誤會在演習內修正。':'下一季會換上新的題目與活動；好感、尊敬和研究日誌延續，不會歸零。'}</p>${mode==='strategy'?`<button class="primary" onclick="beginStrategy()">策略判斷 ${S.strategy+1}/3 →</button>`:''}${mode==='complete'?`<p>本季地理判斷 ${S.records[S.season].correct}/21 正確 · 假日邀約3次已完成。</p><button class="primary" onclick="advanceSeason()">${S.season<3?'進入'+seasons[S.season+1].name+'季 →':'四季結束 · 進入大型災害事件 →'}</button>`:''}</div><div class="grid">${P.map((p,i)=>characterCard(i,mode==='work'?`<div class="small">本季研究線 ${S.done[i]}/3</div><button onclick="beginWork(${i})" ${S.done[i]>=3?'disabled':''}>${S.done[i]>=3?'本季研究完成 ✓':s.work[i][S.done[i]].title+' →'}</button>`:mode==='date'?`<div class="small">本季已相約 ${S.dates[i]}次</div><button onclick="beginDate(${i})">邀約 · ${s.dates[i][S.dates[i]].title} →</button>`:'<div class="small">這一季的合作，會帶進下一段故事。</div>')).join('')}</div>`}
function beginWork(i){if(S.phase!=='hub'||S.active||workCount()>=9||S.done[i]>=3)return;S.active={type:'work',i,stage:S.done[i],step:0,answered:false,result:null};persist();render();topPage()}

function beginStrategy(){if(S.phase!=='hub'||S.active||workCount()!==9||dateCount()!==3||S.strategy>=3)return;S.active={type:'strategy',i:S.strategy,stage:S.strategy,step:0,answered:false,result:null};persist();render();topPage()}
function currentQ(){let a=S.active,s=seasonData();if(a.type==='work')return s.work[a.i][a.stage].qs[a.step];if(a.type==='date')return s.dates[a.i][a.stage];if(a.type==='strategy')return s.strategy[a.stage];return events[a.stage]}
function topPage(){window.scrollTo({top:0,behavior:'smooth'})}
function scene(){let a=S.active,q=currentQ(),s=seasonData(),m=a.type==='work'?s.work[a.i][a.stage]:null,event=a.type==='event',date=a.type==='date';let title=m?m.title:date?q.title:event?q.title:s.name+'季跨災害策略 '+(a.stage+1);let intro=m?m.intro:date||event?q.intro:`三位專家一起檢視${s.name}季方案。${P[a.i].name}主持這段討論：「請把不同災害、暴露人口與執行能力一起考慮，說明措施怎樣減少損失。」`;let view=a.view||(a.answered?'feedback':'story');let stageLabel=event?'最終應變 '+(a.stage+1)+'/8':date?s.name+'季假日邀約':a.type==='work'?s.name+'季研究 '+(a.step+1)+'/2':s.name+'季策略演習';$('app').innerHTML=stats()+`${event?`<div class="eventbanner scene-alert"><div class="eyebrow">大型事件 · 強震、海嘯與火山警戒</div><div class="hearts" aria-label="已錯誤${S.eventWrong}次，上限3次">${[0,1,2].map(i=>`<span style="opacity:${i<S.eventWrong?'.35':'1'}">${i<S.eventWrong?'✕':'◇'}</span>`).join('')}</div><p class="danger">錯誤 ${S.eventWrong}/3 · 第三次錯誤觸發死亡結局</p><div class="small">錯誤累積代表傷勢、延誤與危險暴露；答對不會消除已發生的錯誤。</div></div>`:''}<section class="scene" data-view="${view}"><div class="scene-cast">${portrait(a.i,sceneExpression())}<div class="box cast-info"><h3>${P[a.i].name}</h3><div class="label cast-role">${P[a.i].role}</div><div class="small cast-context">${event?'實際事件 · 依正式應變程序':date?'休假日 · 雙方同意的活動':'資料分析 · 安全模擬'}</div><span class="cast-stage mobile-only">${stageLabel}</span><button class="portrait-zoom mobile-only" onclick="showActivePortrait()" aria-label="放大${P[a.i].name}目前的表情插圖">放大插圖 ↗</button></div></div><div class="box scene-content"><section class="story-pane"><div class="pane-scroll"><div class="eyebrow desktop-stage">${stageLabel}</div><h2>${title}</h2><p class="dialogue">${intro}</p></div><div class="scene-stepnav"><button class="primary" onclick="setSceneView('question')">${date?'作出回應 →':'開始判斷 →'}</button></div></section><section class="question-pane"><div class="pane-scroll"><div class="question-caption mobile-only">${title}</div><h3 class="question-text">${date?'你會怎樣回應？':q.t}</h3><div class="answers">${q.opts.map((o,k)=>`<button onclick="answer(${k})" ${a.answered?'disabled':''}><span class="num">${k+1}</span><span>${esc(o)}</span></button>`).join('')}</div><p class="scene-tip">選擇後不能改答；可從選單查看研究手冊。</p></div><div class="scene-stepnav"><button onclick="setSceneView('story')">重看劇情</button>${a.answered?'<button class="primary" onclick="setSceneView(\'feedback\')">返回解說 →</button>':''}</div></section>${a.answered?`<section class="feedback-pane">${feedback()}<div class="scene-stepnav"><button onclick="setSceneView('question')">重看題目與選項</button></div></section>`:''}</div></section>`}
function answer(k){let a=S.active;if(!a||a.answered)return;let q=currentQ();if(!Number.isInteger(k)||k<0||k>=q.opts.length)return;let ok=k===q.a,event=a.type==='event',date=a.type==='date',da=date?(ok?7:q.badDeltas[k]):event?(ok?5:-4):(ok?1:-1),dr=date?0:event?(ok?4:-3):(ok?1:-1);S.aff[a.i]=Math.max(0,Math.min(event?100:90,S.aff[a.i]+da));S.respect[a.i]=Math.max(0,Math.min(100,S.respect[a.i]+dr));if(date&&ok)S.care[a.i]++;if(event){if(ok)S.eventCorrect++;else S.eventWrong++;if(S.eventWrong>=3)S.eventDeath=true}else if(!date){S.total++;if(ok)S.correct++}a.answered=true;a.view='feedback';a.result={k,ok,da,dr};S.log.push({season:event?'大型事件':sName(),who:P[a.i].name,type:date?'假日邀約':event?'事件應變':a.type==='strategy'?'跨災害策略':'地理研究',title:date?q.title:q.t,chosen:q.opts[k],ok,da,dr,correct:date?'尊重雙方意願與界線':q.opts[q.a],explain:date?(ok?q.e:q.wrong):q.e,eventConsequence:event&&!ok?q.wrong:null});persist();render()}
function sName(){return seasons[S.season].name+'季'}
function feedback(){let a=S.active,q=currentQ(),r=a.result,date=a.type==='date',event=a.type==='event';return `<div class="notice ${r.ok?'':'wrong'}" role="status"><div class="feedback-copy"><strong>${date?(r.ok?'相處更自在':'她希望界線被尊重'):r.ok?'判斷正確':'需要修正判斷'} · 好感 ${r.da>0?'+':''}${r.da}${r.dr?` · 尊敬 ${r.dr>0?'+':''}${r.dr}`:''}</strong>${date?`<p>${r.ok?q.e:q.wrong}</p>`:`<p><b>正確行動／答案：</b>${esc(q.opts[q.a])}</p><p>${q.e}</p>`}${event&&!r.ok?`<p class="danger">後果：${q.wrong}</p><p>事件錯誤累計 ${S.eventWrong}/3。</p>`:''}${event&&S.eventDeath?'<p class="danger">這是本次事件的第三次錯誤。累積的傷勢、延誤與危險暴露已令你無法安全脫離。</p>':!date&&!r.ok&&!event?'<p class="small">本題屬研究或演習，團隊已修正方案，不計入最終事件的致命錯誤。</p>':''}</div><button class="primary" onclick="next()">${event&&S.eventDeath?'查看 Bad ending →':a.type==='work'&&a.step===0?'繼續分析 →':'繼續故事 →'}</button></div>`}
function next(){let a=S.active;if(!a||!a.answered)return;if(a.type==='event'){if(S.eventDeath){let e=events[a.stage];S.eventStep++;S.active=null;S.ending={type:'bad',title:'Bad ending · 未能歸來',story:e.death,percent:recordPercent(),i:-1};S.phase='ending';persist();render();topPage();return}S.eventStep++;S.active=null;if(S.eventStep>=events.length)S.phase='relation'}else if(a.type==='work'&&a.step===0){a.step=1;a.answered=false;a.result=null;a.view='story'}else{if(a.type==='work')S.done[a.i]++;else if(a.type==='date')S.dates[a.i]++;else S.strategy++;S.active=null;if(workCount()===9&&dateCount()===3&&S.strategy===3&&!S.records[S.season]){let before=S.records.reduce((v,r)=>v+r.correct,0);S.records.push({season:S.season,correct:S.correct-before,total:21,dates:[...S.dates]})}}persist();render();topPage()}
function advanceSeason(){if(S.active||workCount()!==9||dateCount()!==3||S.strategy!==3)return;if(S.season<3){S.season++;S.done=[0,0,0];S.dates=[0,0,0];S.strategy=0}else S.phase='crisisBrief';persist();render();topPage()}
function crisisBrief(){$('app').innerHTML=stats()+`<div class="eventbanner"><div class="eyebrow">四季之後 · 大型構造災害事件</div><h1 style="font-size:40px">海嶼市，09:17。</h1><p class="dialogue">你已與三位專家合作一年。跨年交接期間，外海俯衝帶強震引發海嘯；島上本週已被監測的火山活動亦持續，部分區域早有警戒。道路、斜坡、建築與通訊相繼受影響。</p><p>你們不是獨自指揮整座城市，而是先保護自己、依正式程序撤離，再向救援協調單位提供資料。真正的可靠，是在壓力下仍能辨識風險、尊重專業分工。</p><p class="danger">事件共8次應變決策。累計3次錯誤，即觸發玩家在災害中過身的 Bad ending；任何關係分數都不能抵消這個結局。</p><p class="small">正確行動可為對應專家增加好感與專業尊敬。只有成功生還，才會進入原有關係結局。三次上限是遊戲規則；現實的危險行動即使只有一次，也可能造成嚴重後果。</p><button class="primary" onclick="startCrisis()">進入事件 · 開始應變 →</button></div><div class="box"><h3>你們已一起完成</h3><div class="checkpoints">${S.records.map(r=>`<div><b>${seasons[r.season].name}季</b><br><span class="small">${r.correct}/21 正確</span></div>`).join('')}</div></div>`}
function startCrisis(){if(S.phase!=='crisisBrief')return;S.phase='crisis';S.checkpoint={aff:[...S.aff],respect:[...S.respect],logLength:S.log.length};persist();beginEvent()}
function beginEvent(){if(S.phase!=='crisis'||S.active||S.eventStep>=events.length||S.eventDeath)return;let e=events[S.eventStep];S.active={type:'event',i:e.who,stage:S.eventStep,step:0,answered:false,result:null};persist();render();topPage()}
function crisisHub(){$('app').innerHTML=stats()+`<div class="eventbanner"><div class="eyebrow">大型事件仍在進行</div><h2>下一個現場判斷</h2><p>你們保持聯絡，核實資訊，繼續尋找安全位置。</p><p class="danger">目前錯誤 ${S.eventWrong}/3；累計第三次錯誤將觸發死亡結局。</p><button class="primary" onclick="beginEvent()">${events[S.eventStep].title} →</button></div>`}
function relation(){$('app').innerHTML=stats()+`<section class="hero"><div class="eyebrow">安全抵達 · 一年之後的心意</div><h1 style="font-size:42px">你們都平安歸來。</h1><p>在救援單位協調下，你們到達經評估的庇護中心。基本物資與通訊正陸續恢復；中心後續仍要參與資料整理、基建修復和居民支援。你不以冒險換取讚賞，而以行動讓她們看到你的可靠。</p><p class="small">事件應變 ${S.eventCorrect}/8 正確 · 錯誤 ${S.eventWrong}/3。休整之後，你可以坦誠表達好感，也可以選擇珍惜同事情誼。</p></section><div class="grid">${P.map((p,i)=>characterCard(i,`<button onclick="finish(${i})">向${p.name}表達好感 →</button>`)).join('')}</div><div class="box"><button onclick="finish(-1)">珍惜同事情誼，先專注研究</button></div>`}
function finish(i){if(S.phase!=='relation'||S.eventDeath)return;let percent=recordPercent(),good=i>=0&&S.aff[i]>=55&&S.care[i]>=2&&percent>=60;let title,story;if(i<0){title='並肩守護 · 同行結局';story='你選擇先專注研究，也珍惜三位專家的友誼。春天的陌生已成為冬末的信任，大家約好繼續交流研究與生活故事。這段可靠的同行本身也值得珍惜。'}else if(good){title=P[i].name+' · 心意相通';story=P[i].name+'聽完你的心意，微笑說：「四季裏，我看見了你的真誠。這次事件更讓我知道，你願意為安全作出可靠選擇。我也想在工作以外更了解你，我們慢慢開始，好嗎？」你們約定保留專業分工，假日再相約。這是雙方願意嘗試的開始，並非永久承諾。'}else if(S.care[i]<2){title='保持界線 · 同事情誼';story=P[i].name+'肯定你在事件中的合作，也坦誠說：「謝謝你告訴我，但我目前更希望維持同事關係。」你接受她的選擇。專業尊敬與戀愛意願並不相同，可靠的工作不能用來交換感情。'}else if(percent<60){title='先穩住腳步 · 成長結局';story=P[i].name+'珍惜與你的相處，暫時希望保持朋友關係。中心另安排你補修地理知識；你也在四季的研究紀錄中看見需要改善之處。補修是專業成長，並不是取得感情回報的交易。'}else{title='慢慢了解 · 朋友結局';story=P[i].name+'說：「謝謝這一年以及事件中一起合作。和你相處很愉快，但我還沒有準備好進一步發展。」你尊重她的意願，留下朋友的空間，也不把等待變成對方必須接受的壓力。'}S.ending={type:'relationship',i,title,story,percent};S.phase='ending';persist();render();topPage()}
function ending(){let e=S.ending,bad=e.type==='bad';$('app').innerHTML=stats()+`<section class="hero ${bad?'death box':''}"><div class="eyebrow">${bad?'BAD ENDING · 大型事件錯誤3次':'尾聲 · 四季與守護'}</div><h1 style="font-size:40px">${e.title}</h1><p class="finish">${e.story}</p>${bad?'<p>三位專家得知你未能歸來，留下沉重的遺憾。中心記錄這次應變的錯誤，希望後來的人能理解：求助、撤離和尊重安全界線，並不比冒險更不勇敢。</p><p class="small">死亡源於故事中累積的危險暴露；不再進入戀愛或朋友結局。</p>':''}</section>${bad?`<div class="grid ending-portraits">${P.map((p,i)=>`<article class="card">${portrait(i,'sad')}<div class="content"><h3>${p.name}</h3><div class="small">難過／失望</div></div></article>`).join('')}</div>`:e.i<0?`<div class="grid ending-portraits">${P.map((p,i)=>`<article class="card">${portrait(i,'smile')}<div class="content"><h3>${p.name}</h3></div></article>`).join('')}</div>`:''}${!bad&&e.i>=0?`<div style="max-width:320px">${portrait(e.i,endingExpression())}</div>`:''}<div class="box"><h2>四季研究與事件總結</h2><p>全年地理判斷 ${S.correct}/84（${e.percent}%） · 事件決策 ${S.eventCorrect}/${S.eventStep}正確 · 錯誤${S.eventWrong}次</p><div class="checkpoints">${S.records.map(r=>`<div><b>${seasons[r.season].name}季</b><br><span class="small">${r.correct}/21 正確</span></div>`).join('')}</div><p class="small">${bad?'可在日誌回顧錯誤應變與安全替代方案；也可保留四季進度，重試整個最終事件。':'原有關係條件：好感至少55、至少2次尊重互動、四季地理正確率至少60%，並在最終事件生還。這是遊戲分支規則，現實感情不能用分數計算。'}</p><div class="tools"><button class="primary" onclick="journal()">檢視學習與應變紀錄</button><button onclick="exportLog()">下載研究紀錄 TXT</button>${bad?'<button onclick="confirmRetry()">保留四季 · 重試最終事件</button>':''}<button onclick="confirmReset()">從春季重新開始</button></div></div>`}
function modal(content){returnFocus=document.activeElement;$('overlay').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><section class="modalinner" role="dialog" aria-modal="true" aria-label="資訊面板"><button id="closebtn" onclick="closeModal()" style="float:right">關閉 ×</button>${content}</section></div>`;$('closebtn').focus()}
function closeModal(){$('overlay').innerHTML='';if(returnFocus&&returnFocus.isConnected)returnFocus.focus();returnFocus=null}
document.addEventListener('keydown',e=>{if(!$('overlay').innerHTML)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){let f=$('overlay').querySelectorAll('button,input,summary,[tabindex="0"]'),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function help(){modal(`<h2>四季玩法</h2><p>手機以「劇情 → 判斷 → 解說」逐步顯示；可用按鈕重看內容。平板與電腦採較寬版面。畫面較短或字體放大時，題目或解說區可獨立滑動，繼續按鈕仍保持可見。</p><p>每季：9份研究任務 × 2次判斷＝18次；完成後安排3次假日邀約，再做3次跨災害策略判斷。本季合計21次地理判斷。春夏秋冬合計84次地理判斷及12次假日邀約。</p><p>每季的邀約可集中同一位專家或分配給不同的人；同一人的3個活動依序開放。四季結束後，最終事件有8次應變決策。只有事件中錯誤會計入3次死亡上限，而且不會因之後答對而歸零。</p><h3>好感與尊敬</h3><p>研究或策略答對：好感+1、專業尊敬+1；答錯兩者−1。假日體貼回應：好感+7、尊重互動+1；施壓或打斷−4，侵犯界線−7。事件答對：對應專家好感+5、尊敬+4；答錯好感−4、尊敬−3。</p><p>四季期間好感最多90，最終事件可提升至100。好感代表親近；專業尊敬代表可靠，兩者不等於對方必須接受交往。生還後維持原有關係結局：心意相通、朋友、同事、成長或同行。</p><h3>角色插圖</h3><p>三位專家各有6款插圖，會隨研究、假日邀約、選擇結果與災害事件切換。插圖使用網上圖片連結，需要連網；若載入失敗可按重試。網絡中斷時仍可閱讀文字和繼續遊戲。</p><h3>儲存與課堂使用</h3><p>可隨時開手冊複習。這部裝置自動儲存，不是班級雲端排名；可下載TXT交給老師。建議分四節課完成四季，再安排一節課進行事件及討論。若瀏覽器限制儲存，請保持頁面開啟。</p><p>季節影響故事、假日活動和工作安排，不表示構造災害只在某個季節發生。所有人物與事件為虛構；最後第三次錯誤死亡是遊戲規則，不代表現實有兩次安全犯錯的機會。</p>${S?'<button onclick="confirmReset()">從春季重新開始</button>':''}`)}
function notes(which=null){let i=which===null?(S?S.season:0):which,s=seasons[i];modal(`<h2>研究手冊</h2><div class="notesfilters">${seasons.map((x,j)=>`<button onclick="notes(${j})" ${i===j?'class="primary"':''}>${x.symbol} ${x.name}季</button>`).join('')}</div><p class="small">成因、影響、減災及風險分析。題目以不同情境逐季深入；以下提供各季研究解說。</p>${P.map((p,j)=>`<details><summary>${s.name}季 · ${p.field}研究</summary>${s.work[j].flatMap(m=>m.qs).map(q=>`<p><b>${q.t}</b><br>${q.e}</p>`).join('')}</details>`).join('')}<details><summary>${s.name}季 · 跨災害策略</summary>${s.strategy.map(q=>`<p><b>${q.t}</b><br>${q.e}</p>`).join('')}</details><details><summary>最終事件 · 應變重點</summary>${events.map(q=>`<p><b>${q.title}</b><br>${q.e}</p>`).join('')}</details><h3>關鍵限制</h3><p>構造災害多集中於板塊邊界；板內斷層也可發震，熱點也可形成火山。監測不等於能準確預測地震的時間、地點及震級。不是每次海底地震都引發海嘯，也不是每次地震都導致火山爆發。</p><p>屏障、加固、保險或單一先兆都不能保證安全。減災需結合風險評估、建築與土地利用規劃、預警傳達、演習、專業救援及災後修復。</p>`)}
function journal(){if(!S)return modal('<h2>研究日誌</h2><p>報到後會記錄你的四季選擇與應變解說。</p>');modal(`<h2>${esc(S.name)}的研究日誌</h2><p>四季地理 ${S.correct}/${S.total}正確 · 事件 ${S.eventCorrect}次正確、${S.eventWrong}次錯誤</p><button onclick="exportLog()">下載紀錄 TXT</button>${S.log.map((r,i)=>`<details><summary>${i+1}. ${r.ok?'✓':'△'} ${r.season} · ${esc(r.who)} · ${esc(r.title)}</summary><p>類型：${r.type}<br>你的選擇：${esc(r.chosen)}</p><p><b>正確答案／原則：</b>${esc(r.correct)}</p><p>${r.explain}</p>${r.eventConsequence?`<p class="warning">${r.eventConsequence}</p>`:''}<div class="small">好感 ${r.da>0?'+':''}${r.da}${r.dr?` · 尊敬 ${r.dr>0?'+':''}${r.dr}`:''}</div></details>`).join('')||'<p>尚未作出選擇。</p>'}`)}
function exportLog(){if(!S)return;let text=`心動板塊｜四季研究與事件紀錄\n姓名：${S.name}\n四季地理判斷：${S.correct}/${S.total}（已完成${S.total}/84次）\n事件：${S.eventCorrect}次正確、${S.eventWrong}次錯誤\n結局：${S.ending?S.ending.title:'未完成'}\n\n`+S.records.map(r=>`${seasons[r.season].name}季：${r.correct}/21正確\n`).join('')+'\n'+S.log.map((r,i)=>`${i+1}. ${r.season}｜${r.who}｜${r.title}\n類型：${r.type}\n選擇：${r.chosen}\n結果：${r.ok?'正確／尊重互動':'需修正'}\n正確答案／原則：${r.correct}\n解說：${r.explain}\n${r.eventConsequence?'事件後果：'+r.eventConsequence+'\n':''}`).join('\n');let url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='心動板塊_四季研究紀錄.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function confirmRetry(){modal('<h2>重試最終事件？</h2><p>保留四季研究與假日紀錄，把好感和尊敬恢復到事件開始前；清除這次事件的決策和錯誤，從第一個現場判斷重新開始。</p><button class="primary" onclick="retryCrisis()">確認重試事件</button> <button onclick="closeModal()">保留目前結局</button>')}
function retryCrisis(){if(!S||S.phase!=='ending'||S.ending.type!=='bad'||!S.checkpoint)return;let c=S.checkpoint;S.aff=[...c.aff];S.respect=[...c.respect];S.log=S.log.slice(0,c.logLength);S.eventStep=0;S.eventWrong=0;S.eventCorrect=0;S.eventDeath=false;S.active=null;S.ending=null;S.phase='crisis';closeModal();persist();beginEvent()}
function confirmReset(){modal('<h2>從春季重新開始？</h2><p>會清除這部裝置的四季與事件進度。如有需要，先下載研究紀錄。</p><button class="bad" onclick="reset()">清除四季進度，回到首頁</button> <button onclick="closeModal()">保留故事</button>')}
function reset(){S=null;saved=null;try{localStorage.removeItem(KEY)}catch(e){}closeModal();home()}
home();

</script></body></html>
